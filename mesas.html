<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta y cambia el estado de las mesas del restaurante en Restaurapp.">
  <title>Mesas | Restaurapp</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__top">
        <a href="index.html" class="brand">
          <img src="img/logo.svg" alt="Logo de Restaurapp" class="brand__logo" width="40" height="40">
          <span class="brand__name">Restaurapp</span>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainNav">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <nav class="nav" id="mainNav" aria-label="Navegación principal">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Inicio</a></li>
          <li><a href="ordenes.html" class="nav__link">Ordenes</a></li>
          <li><a href="mesas.html" class="nav__link is-active" aria-current="page">Mesas</a></li>
          <li><a href="menu.html" class="nav__link">Menú</a></li>
          <li><a href="nueva-orden.html" class="nav__link">Nueva orden</a></li>
        </ul>
      </nav>
    </aside>

    <div class="content">
      <main>
        <section class="section">
          <header class="section__header">
            <h1 class="section__title">Mesas</h1>
            <p class="section__hint">Toca una mesa para cambiar su estado.</p>
          </header>

          <div class="tables" id="tablesGrid">
            <button class="table-card is-occupied" data-table="1"><span class="table-card__num">1</span><span class="table-card__state">Ocupada</span></button>
            <button class="table-card is-occupied" data-table="2"><span class="table-card__num">2</span><span class="table-card__state">Ocupada</span></button>
            <button class="table-card" data-table="3"><span class="table-card__num">3</span><span class="table-card__state">Libre</span></button>
            <button class="table-card" data-table="4"><span class="table-card__num">4</span><span class="table-card__state">Libre</span></button>
            <button class="table-card is-occupied" data-table="5"><span class="table-card__num">5</span><span class="table-card__state">Ocupada</span></button>
            <button class="table-card" data-table="6"><span class="table-card__num">6</span><span class="table-card__state">Libre</span></button>
            <button class="table-card is-occupied" data-table="7"><span class="table-card__num">7</span><span class="table-card__state">Ocupada</span></button>
            <button class="table-card" data-table="8"><span class="table-card__num">8</span><span class="table-card__state">Libre</span></button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Restaurapp. Todos los derechos reservados.</p>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/main.js"></script>
</body>
</html>
